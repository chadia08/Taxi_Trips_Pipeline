services:
  postgres:
    image: postgres:15-alpine
    container_name: chicago_postgres
    environment:
      POSTGRES_USER: dagster
      POSTGRES_PASSWORD: dagster_password
      POSTGRES_DB: dagster_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - data_network

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: chicago_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - data_network

  create-bucket:
    image: curlimages/curl:latest
    container_name: chicago_create_bucket
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO...' &&
      sleep 5;
      echo 'Bucket datalake simulation ready via S3 API';
      "
    networks:
      - data_network

  dagster:
    build: .
    container_name: chicago_dagster
    entrypoint: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-w", "workspace.yaml"]
    environment:
      DAGSTER_PG_USERNAME: dagster
      DAGSTER_PG_PASSWORD: dagster_password
      DAGSTER_PG_HOST: postgres
      DAGSTER_PG_PORT: 5432
      DAGSTER_PG_DB: dagster_db
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "3000:3000"
    volumes:
      - ./src:/opt/dagster/app/src
      - .:/opt/dagster/app
    depends_on:
      - postgres
      - minio
    networks:
      - data_network

volumes:
  pg_data:
    name: chicago_pg_data
  minio_data:
    name: chicago_minio_data

networks:
  data_network:
    driver: bridge